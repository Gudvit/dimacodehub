<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dmytro Huliaiev - Senior Frontend Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      GitHub Pages cannot send headers, so the policy ships as a meta tag. It is the whole
      outside world this app touches: the Web3Forms endpoint, Google Fonts, and nothing
      else. 'unsafe-inline' for styles is unavoidable - Angular inlines component styles.
      The one inline script allowed is the theme script below, by its hash: change a byte of
      it and the hash must change too (index-html.spec.ts checks). frame-ancestors is not
      here - browsers ignore it in a meta tag and log an error for trying.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'none';
               img-src 'self' data:;
               script-src 'self' 'sha256-M/Jt+U9rDPhNexaDjIh0znqkCftgWXaJ4uP8V0og9Ww=';
               connect-src 'self' https://api.web3forms.com;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com"
    />

    <meta
      name="description"
      content="Senior Frontend Engineer with 10+ years of experience in Angular, frontend architecture, and performance. Based in Cracow, Poland - open to remote work."
    />
    <meta name="author" content="Dmytro Huliaiev" />
    <meta name="theme-color" content="#191d3f" />
    <!--
      Applies the theme picked with the header toggle (ThemeToggleComponent, key "theme")
      before the first paint, so a visitor who chose dark on a light system never sees a
      white flash. Inline, so it costs no request; allowed by its hash in the CSP above.
    -->
    <script id="theme-init">
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dmytro Huliaiev" />
    <meta property="og:title" content="Dmytro Huliaiev - Senior Frontend Engineer" />
    <meta
      property="og:description"
      content="Senior Frontend Engineer with 10+ years of experience in Angular, frontend architecture, and performance."
    />
    <meta property="og:url" content="https://gudvit.github.io/dimacodehub/" />
    <meta property="og:image" content="https://gudvit.github.io/dimacodehub/images/og-cover.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dmytro Huliaiev - Senior Frontend Engineer" />
    <meta
      name="twitter:description"
      content="Senior Frontend Engineer with 10+ years of experience in Angular, frontend architecture, and performance."
    />
    <meta name="twitter:image" content="https://gudvit.github.io/dimacodehub/images/og-cover.jpg" />

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Dmytro Huliaiev — Blog"

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
