<header class="site-header">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <img src="images/logo.svg" alt="Dmytro Huliaiev - home" />
    <span class="brand-name" aria-hidden="true">
      <span class="first">DMYTRO</span>
      <span class="last">HULIAIEV</span>
    </span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    [class.is-open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-nav"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="nav" id="site-nav" aria-label="Main" [class.is-open]="menuOpen()">
    <!-- The home slides. Each link scrolls the home page to its slide (from any page); the
         underline marks the slide in view, or the section the current page belongs to. -->
    @for (section of sections; track section.id) {
      <a
        routerLink="/"
        [fragment]="section.id"
        [class.active]="activeSection() === section.id"
        [attr.aria-current]="activeSection() === section.id ? 'location' : null"
        (click)="goToSection(section.id)"
        >{{ section.label }}</a
      >
    }
  </nav>

  <button
    class="palette-trigger"
    type="button"
    aria-label="Search and commands"
    aria-keyshortcuts="Meta+K Control+K"
    title="Search and commands (⌘K)"
    (click)="openPalette()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" />
      <path d="m20 20-4.4-4.4" />
    </svg>
  </button>

  <app-theme-toggle class="theme-slot"></app-theme-toggle>
</header>
