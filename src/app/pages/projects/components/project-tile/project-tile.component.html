<article class="work" [class.work--featured]="featured()">
  @if (study().cover; as cover) {
    <img
      class="work__image"
      [src]="cover.src"
      alt=""
      width="1600"
      height="900"
      [attr.fetchpriority]="featured() ? 'high' : null"
      decoding="async"
    />
  } @else {
    <!-- No picture yet: the project's initials over a fine grid. -->
    <div class="work__image work__image--placeholder" aria-hidden="true">
      <span>{{ initials(study().title) }}</span>
    </div>
  }

  <div class="work__overlay">
    <!-- One real link, on the name, stretched over the whole tile. -->
    <h3 class="work__title">
      <a class="work__link" [routerLink]="['/projects', study().slug]"
        ><span class="work__name">{{ study().title }}</span></a
      >
    </h3>
  </div>
</article>
