<main class="home-slider" #homeSlider>
  <app-home-hero-section
    (scrollNext)="scrollToNextSection()"
    (scrollToContacts)="scrollToContactsSection()"
  ></app-home-hero-section>

  <app-home-about-section></app-home-about-section>

  <app-home-experience-section></app-home-experience-section>

  <!-- Deferred so the case studies stay out of the initial bundle, like the posts below. -->
  @defer (on viewport; prefetch on idle) {
    <app-home-projects-section></app-home-projects-section>
  } @placeholder {
    <!-- Carries the section's id, so `/#projects` lands here before the section loads. -->
    <div class="projects-placeholder slide-section" id="projects" aria-hidden="true"></div>
  }

  <!-- Deferred so the posts stay out of the initial bundle; see the local CLAUDE.md. -->
  @defer (on viewport; prefetch on idle) {
    <app-home-writing-section></app-home-writing-section>
  } @placeholder {
    <!-- Carries the section's id, so `/#writing` lands here before the section loads. -->
    <div class="writing-placeholder slide-section" id="writing" aria-hidden="true"></div>
  }

  <!-- Deferred so the form, @angular/forms and the section's styles stay off the first load. -->
  @defer (on viewport; prefetch on idle) {
    <app-home-contact-section (backToTop)="scrollToTop()"></app-home-contact-section>
  } @placeholder {
    <!-- Carries the section's id, so `/#contacts` lands here before the section loads. -->
    <div class="contact-placeholder slide-section" id="contacts" aria-hidden="true"></div>
  }
</main>

<!-- A phone's way through the slides: next while going down, previous once turned back. -->
<button
  class="slide-step"
  type="button"
  [class.is-visible]="stepVisible()"
  [class.is-up]="stepDirection() === 'up'"
  [class.is-raised]="stepRaised()"
  [attr.aria-label]="stepDirection() === 'up' ? 'Previous section' : 'Next section'"
  [attr.tabindex]="stepVisible() ? null : -1"
  [attr.aria-hidden]="stepVisible() ? null : 'true'"
  (click)="step()"
></button>
