<section class="hero slide-section">

  <div class="hero-text">
    <h1 class="name">Dmytro Huliaiev</h1>
    <p class="eyebrow">Senior Frontend Engineer</p>
    <p class="availability">
      <span class="availability__dot" aria-hidden="true"></span>
      Open to new conversations<span class="availability__where"> · Kraków, remote</span>
    </p>

      I help product teams build Angular platforms that stay fast, tested and easy to change — 10+

    </p>
    <div class="hero-actions">
      <!-- Contracts come first (docs/roadmap.md, 0.1): the solid button is the main action. -->
      <button class="primary primary--solid" type="button" (click)="scrollToContacts.emit()">
        Discuss a project
      </button>
      <a class="primary" href="dmytro_huliaiev_cv.pdf" download>Download CV</a>
    </div>
  </div>
  <button
    class="scroll-hint"
    type="button"
    aria-label="Scroll to next section"
    (click)="scrollNext.emit()"
  ></button>
</section>
