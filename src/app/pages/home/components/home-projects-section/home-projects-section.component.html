<!-- Without a published project there is no slide at all, rather than an empty one. -->
@if (projects.length) {
  <section class="projects slide-section" id="projects">
    <h2 class="projects__display-title">PROJECTS</h2>
    <div class="projects__inner">
      <header class="projects__head">
        <p class="projects__headline">Work, and how it was done</p>
      </header>
      <app-project-grid class="projects__grid" [projects]="projects" />
    </div>
  </section>
}
