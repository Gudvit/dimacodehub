version: 2
updates:
  # Nothing watched the dependencies, which is exactly how the Angular patch level drifted
  # into two published XSS advisories. Weekly is enough for a site with nine runtime
  # dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # The workflow pins actions by commit SHA; this is what keeps the pins moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
