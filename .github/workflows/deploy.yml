name: CI and deploy to GitHub Pages

# Every branch runs the gate; only `main` gets past it to the deploy job. One run per
# push: the workflow deliberately does not listen to `pull_request` as well, since a PR
# branch in this repository is already covered by its own push.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Production dependencies only: a dev-tool advisory must not block a deploy of code
      # that never ships it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:unit:coverage
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Build
        run: npm run build:gh
      # Every known route is prerendered (ADR 0019). Anything else falls through to Pages'
      # 404.html: the empty client shell, not index.html, which is now the home page.
      - name: Add SPA fallback
        run: cp dist/dimacodehub/browser/index.csr.html dist/dimacodehub/browser/404.html
      - name: Check the prerendered pages and feeds
        working-directory: dist/dimacodehub/browser
        run: |
          grep -l 'property="og:type" content="article"' blog/*/index.html
          grep -c '<item>' feed.xml
          grep -c '<url>' sitemap.xml
          for post in blog/*/; do test -s "og/blog/$(basename "$post").jpg"; done
          test -s build-stats.json
      # Mobile Lighthouse on one page of each kind; fails below the budgets in
      # scripts/lighthouse.ts and adds the home page's scores to build-stats.json.
      - name: Lighthouse budgets
        run: npm run lighthouse
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/dimacodehub/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages allows one deployment at a time, whatever else is running.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
